<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaqueline Vacari — Eventos</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#CD8680">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo-app">
    <img src="assets/icons/icon-192.png" alt="Jaqueline Vacari">
    <h1>Jaqueline Vacari — Eventos</h1>
  </header>

  <main>
    <button class="botao" id="btn-abrir-modal">+ Novo evento</button>

    <div id="lista-eventos" style="margin-top: 20px;"></div>
  </main>

  <!-- Modal: novo evento -->
  <div class="modal" id="modal-novo-evento">
    <div class="modal__conteudo">
      <h2>Novo evento</h2>
      <form id="form-novo-evento">
        <div class="campo">
          <label>Nome do evento</label>
          <input type="text" name="nomeEvento" required placeholder="Ex: Casamento Ana & Pedro">
        </div>
        <div class="campo">
          <label>Data</label>
          <input type="date" name="dataEvento">
        </div>
        <div class="campo">
          <label>Local (opcional)</label>
          <input type="text" name="local" placeholder="Ex: Espaço Villa Rosa">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="botao botao--secundario" id="btn-fechar-modal">Cancelar</button>
          <button type="submit" class="botao">Criar evento</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="loading" id="loading">Carregando…</div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/eventos.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
