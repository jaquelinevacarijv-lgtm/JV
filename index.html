<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaqueline Vacari — Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --sage-deep:   #7C8B72;
    --sage:        #A9B79E;
    --sage-light:  #E1E8DA;
    --cream:       #FBF9F4;
    --white:       #FFFFFF;
    --ink:         #3B3C32;
    --ink-soft:    #8A8B7C;
    --gold:        #BFA06A;
    --gold-soft:   #F1E9D6;
    --green:       #6E9575;
    --border:      #EAE6DC;
    --shadow:      0 10px 26px rgba(60,64,45,0.07);
    --shadow-hover:0 16px 32px rgba(60,64,45,0.13);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Jost', sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
  }

  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:22px 48px;
    border-bottom:1px solid var(--border);
    background:var(--cream);
  }

  .logo{
    width:40px; height:40px;
    border-radius:50%;
    border:1.5px solid var(--sage);
    background:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:1rem;
    color:var(--sage-deep);
    flex-shrink:0;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.5rem;
    color:var(--sage-deep);
    letter-spacing:0.01em;
  }

  h1 span{
    font-weight:400;
    color:var(--ink-soft);
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:44px 24px 60px;
  }

  .btn-new{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--sage-deep);
    color:var(--white);
    border:none;
    padding:13px 24px;
    border-radius:100px;
    font-family:'Jost', sans-serif;
    font-size:0.9rem;
    font-weight:500;
    letter-spacing:0.02em;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    margin-bottom:30px;
  }

  .btn-new:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-hover);
    background:#6d7c64;
  }

  .events{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .texto-vazio{
    color:var(--ink-soft);
    font-size:0.92rem;
    padding:20px 4px;
  }

  .card-evento{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px 26px;
    display:block;
    text-decoration:none;
    color:inherit;
    transition:transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .card-evento:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-hover);
    border-color:var(--sage-light);
  }

  .card-evento__topo{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:4px;
  }

  .card-evento__topo h3{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.4rem;
  }

  .card-evento > p{
    font-size:0.86rem;
    color:var(--ink-soft);
    margin-bottom:12px;
  }

  .resumo-convidados{
    display:flex;
    align-items:center;
    gap:18px;
    font-size:0.86rem;
    color:var(--ink-soft);
  }

  .resumo-convidados__item--presente{
    color:var(--green);
    font-weight:500;
  }

  .badge{
    padding:6px 14px;
    border-radius:100px;
    font-size:0.74rem;
    font-weight:500;
    letter-spacing:0.03em;
    white-space:nowrap;
    flex-shrink:0;
  }

  .badge--ativo{ background:var(--sage-light); color:var(--sage-deep); }
  .badge--finalizado{ background:#EEE; color:var(--ink-soft); }

  /* Modal de novo evento */
  .modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(59,60,50,0.4);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }

  .modal.modal--visivel{ display:flex; }

  .modal__conteudo{
    background:var(--white);
    border-radius:20px;
    padding:32px;
    max-width:480px;
    width:100%;
    max-height:86vh;
    overflow-y:auto;
    box-shadow:var(--shadow-hover);
  }

  .modal__topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
  }

  .modal__topo h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.3rem;
    color:var(--sage-deep);
  }

  #btn-fechar-modal{
    background:none;
    border:none;
    font-size:1.2rem;
    color:var(--ink-soft);
    cursor:pointer;
    line-height:1;
  }

  label{
    display:block;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin:16px 0 6px;
  }

  input[type="text"], input[type="date"]{
    width:100%;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    font-family:'Jost', sans-serif;
    font-size:0.9rem;
    color:var(--ink);
  }

  .linha-convidado-novo{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }

  .linha-convidado-novo__mesa{ max-width:90px; }

  .botao-remover{
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:1rem;
  }

  .btn-secundario{
    background:var(--sage-light);
    color:var(--sage-deep);
    border:none;
    padding:8px 16px;
    border-radius:100px;
    font-family:'Jost', sans-serif;
    font-size:0.82rem;
    font-weight:500;
    cursor:pointer;
    margin-top:4px;
  }

  #nome-arquivo-selecionado{
    display:block;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .modal__rodape{
    display:flex;
    justify-content:flex-end;
    margin-top:26px;
  }

  .btn-primario{
    background:var(--sage-deep);
    color:var(--white);
    border:none;
    padding:12px 26px;
    border-radius:100px;
    font-family:'Jost', sans-serif;
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
  }

  @media (max-width:560px){
    header{ padding:18px 20px; }
    main{ padding:32px 16px 48px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">JV</div>
    <h1>Jaqueline Vacari <span>— Eventos</span></h1>
  </header>

  <main>
    <button class="btn-new" id="btn-abrir-modal">+ Novo evento</button>

    <div class="events" id="lista-eventos">
      <p class="texto-vazio">Carregando eventos...</p>
    </div>
  </main>

  <!-- Modal: criar novo evento -->
  <div class="modal" id="modal-novo-evento">
    <div class="modal__conteudo">
      <div class="modal__topo">
        <h2>Novo evento</h2>
        <button type="button" id="btn-fechar-modal" aria-label="Fechar">✕</button>
      </div>

      <form id="form-novo-evento">
        <label for="nomeEvento">Nome do evento</label>
        <input type="text" id="nomeEvento" name="nomeEvento" required>

        <label for="dataEvento">Data</label>
        <input type="date" id="dataEvento" name="dataEvento">

        <label for="local">Local</label>
        <input type="text" id="local" name="local">

        <label>Convidados (opcional agora, dá pra adicionar depois)</label>
        <div id="linhas-convidados"></div>
        <button type="button" class="btn-secundario" id="btn-add-linha-convidado">+ Adicionar convidado</button>

        <label for="input-importar-novo-evento">Ou importar lista (xlsx/csv)</label>
        <input type="file" id="input-importar-novo-evento" accept=".xlsx,.xls,.csv">
        <span id="nome-arquivo-selecionado"></span>

        <div class="modal__rodape">
          <button type="submit" class="btn-primario">Criar evento</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/eventos.js"></script>
</body>
</html>
